<ion-app>
  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>SIMOBILE</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle>
          <ion-item routerLink="/dashboard">
            <ion-icon name="home" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
          <ion-item routerLink="/produk">
            <ion-icon name="cube" slot="start"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>
          <ion-item routerLink="/pengaturan">
            <ion-icon name="settings" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
          <ion-item routerLink="/tentang">
            <ion-icon name="information-circle" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button routerLink="dashboard">
        <ion-icon name="home"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>
      <ion-tab-button routerLink="produk">
        <ion-icon name="cube"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>
      <ion-tab-button routerLink="transaksi">
        <ion-icon name="cart"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>
      <ion-tab-button routerLink="profil">
        <ion-icon name="person"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>

</ion-app>
