<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard SIMOBILE</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid class="fade-in">
    <ion-row>
      <ion-col size="12">
        <ion-card color="primary"
          style="margin: 0 0 10px 0; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content style="display: flex; align-items: center;">
            <ion-icon name="storefront-outline" style="font-size: 45px; margin-right: 15px; color: white;"></ion-icon>
            <div style="flex: 1;">
              <h2 style="font-weight: bold; margin: 0; font-size: 20px; color: white;">Selamat Datang</h2>
              <p style="margin: 5px 0 0 0; font-size: 14px; color: rgba(255, 255, 255, 0.9);">Toko Makmur Jaya</p>
            </div>
            <div>
              <ion-button fill="outline" color="light" shape="round" size="small" (click)="refreshData()">
                <ion-icon name="refresh" slot="start"></ion-icon>
                Refresh
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <!-- Total Produk -->
      <ion-col size="6">
        <ion-card routerLink="/produk" style="margin: 0; height: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;">
          <ion-card-content class="ion-text-center">
            <ion-icon name="pricetags-outline" color="success" style="font-size: 40px; margin-bottom: 5px;"></ion-icon>
            <h1 style="font-weight: bold; margin: 0;">{{ totalProducts }}</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px;">Total Produk</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Transaksi -->
      <ion-col size="6">
        <ion-card routerLink="/riwayattransaksi" style="margin: 0; height: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;">
          <ion-card-content class="ion-text-center">
            <ion-icon name="cart-outline" color="success" style="font-size: 40px; margin-bottom: 5px;"></ion-icon>
            <h1 style="font-weight: bold; margin: 0;">{{ totalTransaksiHariIni }}</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px;">Transaksi</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Pendapatan Hari Ini -->
      <ion-col size="6" style="margin-top: 5px;">
        <ion-card style="margin: 0; height: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content class="ion-text-center">
            <ion-icon name="wallet-outline" color="success" style="font-size: 40px; margin-bottom: 5px;"></ion-icon>
            <h2 style="font-weight: bold; margin: 0; font-size: 18px;">Rp {{ totalPendapatanHariIni | number }}</h2>
            <p style="margin: 5px 0 0 0; font-size: 13px;">Pendapatan Harian</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Produk Terlaris -->
      <ion-col size="6" style="margin-top: 5px;">
        <ion-card style="margin: 0; height: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content class="ion-text-center">
            <ion-icon name="trophy-outline" color="success" style="font-size: 40px; margin-bottom: 5px;"></ion-icon>
            <h2
              style="font-weight: bold; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
              {{ bestSeller }}
            </h2>
            <p style="margin: 5px 0 0 0; font-size: 13px;">Produk Terlaris</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
