<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard SIMOBILE</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div style="display: flex; justify-content: flex-start; margin-bottom: 15px;" class="fade-in">
    <ion-button fill="outline" color="solid" shape="round" (click)="refreshData()">
      <ion-icon name="refresh" slot="start"></ion-icon>
      Refresh
    </ion-button>
  </div>

  <ion-grid class="fade-in">
    <ion-row>
      <ion-col size="6">
        <ion-card style="margin: 0; height: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content class="ion-text-center">
            <ion-icon name="pricetags-outline" color="primary" style="font-size: 40px; margin-bottom: 5px;"></ion-icon>
            <h1 style="font-weight: bold; margin: 0;">{{ totalProducts }}</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px;">Total Produk</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card style="margin: 0; height: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content class="ion-text-center">
            <ion-icon name="cart-outline" color="success" style="font-size: 40px; margin-bottom: 5px;"></ion-icon>
            <h1 style="font-weight: bold; margin: 0;">{{ totalTransaksiHariIni }}</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px;">Transaksi</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row class="ion-margin-top">
      <ion-col size="12">
        <ion-card style="margin: 0; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content style="display: flex; align-items: center;">
            <ion-icon name="wallet-outline" color="warning" style="font-size: 42px; margin-right: 15px;"></ion-icon>
            <div>
              <p style="margin: 0; font-size: 14px;">Pendapatan Hari Ini</p>
              <h2 style="font-weight: bold; margin: 5px 0 0 0;">Rp {{ totalPendapatanHariIni }}</h2>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row class="ion-margin-top">
      <ion-col size="12">
        <ion-card style="margin: 0; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
          <ion-card-content style="display: flex; align-items: center;">
            <ion-icon name="trophy-outline" color="tertiary" style="font-size: 42px; margin-right: 15px;"></ion-icon>
            <div>
              <p style="margin: 0; font-size: 14px;">Produk Terlaris</p>
              <h2 style="font-weight: bold; margin: 5px 0 0 0;">{{ bestSeller }}</h2>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
  
</ion-content>
