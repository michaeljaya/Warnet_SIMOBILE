<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-text-center slide-up" style="margin-top: 30px;">
    <ion-avatar style="width: 100px; height: 100px; margin: 0 auto;">
      <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
    </ion-avatar>
    <h2 style="font-weight: bold; margin-bottom: 5px;">Bu Marni</h2>
    <p style="color: var(--ion-color-medium); margin-top: 0;">Toko Makmur Jaya</p>

    <ion-list style="margin-top: 30px; text-align: left; background: transparent;" lines="full">
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-label>
          <h3 style="font-size: 13px; color: var(--ion-color-medium);">Nama Lengkap</h3>
          <p style="font-size: 16px; font-weight: 500; color: var(--ion-text-color);"> Bu Marni</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="call-outline" slot="start" color="medium"></ion-icon>
        <ion-label>
          <h3 style="font-size: 13px; color: var(--ion-color-medium);">Nomor Telepon</h3>
          <p style="font-size: 16px; font-weight: 500; color: var(--ion-text-color);">0812-3456-7890</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="location-outline" slot="start" color="medium"></ion-icon>
        <ion-label>
          <h3 style="font-size: 13px; color: var(--ion-color-medium);">Alamat Toko</h3>
          <p style="font-size: 16px; font-weight: 500; color: var(--ion-text-color); white-space: normal;">
            Jl. Warnet No. 2, Surabaya, 9699108
          </p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <ion-label>
          <h3 style="font-size: 13px; color: var(--ion-color-medium);">Email</h3>
          <p style="font-size: 16px; font-weight: 500; color: var(--ion-text-color);">bumarni.makmur@gmail.com</p>
        </ion-label>
      </ion-item>

    </ion-list>

    <!-- Tombol Logout -->
    <ion-button id="logout-alert" expand="block" color="danger" fill="solid" style="margin-top: 30px;">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Logout
    </ion-button>

    <ion-alert trigger="logout-alert" header="Konfirmasi Keluar" message="Apakah Anda yakin ingin keluar dari akun ini?"
      [buttons]="logoutButtons">
    </ion-alert>
  </div>
</ion-content>
